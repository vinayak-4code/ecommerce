<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Storefront | VinCommerce</title>
    <link rel="stylesheet" th:href="@{/css/ecommerce.css}">
    <script defer th:src="@{/js/portal.js}"></script>
</head>
<body data-page="customer" onload="initCustomerWorkspace()">
<div class="workspace customer-workspace">
    <aside class="sidebar slim">
        <a class="brand side-brand" href="/">🛍️ VinCommerce</a>
        <button data-customer-section="shop-section" class="side-link active" onclick="showCustomerSection('shop-section')">Discover</button>
        <button class="side-link" onclick="openCustomerCart()">Cart <span id="public-cart-count">0</span></button>
        <button data-customer-section="orders-section" class="side-link" onclick="showCustomerSection('orders-section');loadAndRenderCustomerOrders()">Orders</button>
        <button data-customer-section="account-section" class="side-link" onclick="showCustomerSection('account-section')">Account</button>
        <button class="side-link danger" onclick="logoutRole('CUSTOMER')">Logout</button>
    </aside>
    <main class="workspace-main">
        <header class="workspace-topbar">
            <div><span class="eyebrow">Customer</span><h1>Shopping workspace</h1></div>
            <div class="header-search compact"><input id="public-search" placeholder="Search products" onkeydown="if(event.key==='Enter') searchPublicCatalog()"><button onclick="searchPublicCatalog()">Search</button></div>
        </header>

        <section id="shop-section" class="customer-section active">
            <div class="market-layout">
                <aside class="filter-panel">
                    <h3>Categories</h3><div id="public-category-tree" class="tree-list"></div>
                    <h3>Attributes</h3><div id="public-attribute-filters"></div>
                    <label class="check-row"><input id="public-instock-only" type="checkbox" onchange="renderPublicCatalog()"> In stock only</label>
                </aside>
                <section class="catalog-panel">
                    <div class="section-title-row"><div><span class="eyebrow">Catalog</span><h2>Browse products</h2><p id="public-result-subtitle" class="muted"></p></div><select id="public-sort" onchange="searchPublicCatalog()"><option value="name|ASC">Name</option><option value="price|ASC">Price low</option><option value="price|DESC">Price high</option><option value="totalAvailableQuantity|DESC">Availability</option></select></div>
                    <div id="public-product-grid" class="product-grid market-grid"></div>
                </section>
            </div>
        </section>

        <section id="orders-section" class="customer-section"><div class="section-title-row"><div><span class="eyebrow">Orders</span><h2>Your orders</h2></div><button onclick="loadAndRenderCustomerOrders()">Refresh</button></div><div id="customer-orders-table"></div></section>
        <section id="account-section" class="customer-section"><div id="customer-account-card"></div></section>
    </main>
</div>

<div id="cart-drawer" class="drawer right-drawer"><div class="drawer-header"><h2>Your cart</h2><button onclick="closeDrawer('cart-drawer')">✕</button></div><div id="cart-body" class="drawer-body"></div><div id="cart-coupons" class="drawer-body"></div><div id="cart-summary" class="drawer-footer"></div></div>
<div id="product-modal" class="modal"><div class="modal-card product-modal-card"><button class="modal-x" onclick="closeModal('product-modal')">✕</button><div id="product-modal-body"></div></div></div>
<div id="login-required-modal" class="modal"><div class="modal-card small-modal"><button class="modal-x" onclick="closeModal('login-required-modal')">✕</button><h2>Login required</h2><p id="login-required-message" class="muted">Please login to continue.</p><a class="btn-primary" href="/customer/login">Login</a></div></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
