<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - E-commerce Platform</title>
    <link rel="stylesheet" th:href="@{/css/ecommerce.css}">
    <script defer th:src="@{/js/ecommerce-ui.js}"></script>
</head>
<body>
<header>
    <div class="header-content">
        <span class="badge">New Account</span>
        <h1>Create your account</h1>
        <p>Register as a Customer to shop, or as a Seller to list products.</p>
        <nav class="header-nav">
            <a th:href="@{/}">← Home</a>
            <a th:href="@{/login}">Already have an account? Log in</a>
        </nav>
    </div>
</header>
<main>
    <section class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchSignupTab('customer')">🛒 Customer</button>
            <button class="tab-btn" onclick="switchSignupTab('seller')">🏬 Seller</button>
        </div>

        <div id="signup-customer-form" class="auth-form">
            <div class="form-group">
                <label for="signup-customer-email">Email address</label>
                <input id="signup-customer-email" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="signup-customer-password">Password</label>
                <input id="signup-customer-password" type="password" placeholder="Minimum 8 characters (letter + number)" required>
                <span class="hint">Must be at least 8 characters with at least one letter and one number</span>
            </div>
            <div class="form-group">
                <label for="signup-customer-fullname">Full name</label>
                <input id="signup-customer-fullname" type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="signup-customer-phone">Phone number <span class="optional">(optional)</span></label>
                <input id="signup-customer-phone" type="tel" placeholder="+91 9876543210">
            </div>
            <button class="btn-primary btn-full" onclick="signupCustomer()">Create Customer Account</button>
        </div>

        <div id="signup-seller-form" class="auth-form" style="display:none;">
            <div class="form-group">
                <label for="signup-seller-email">Business email</label>
                <input id="signup-seller-email" type="email" placeholder="business@company.com" required>
            </div>
            <div class="form-group">
                <label for="signup-seller-password">Password</label>
                <input id="signup-seller-password" type="password" placeholder="Minimum 8 characters (letter + number)" required>
                <span class="hint">Must be at least 8 characters with at least one letter and one number</span>
            </div>
            <div class="form-group">
                <label for="signup-seller-business">Business name</label>
                <input id="signup-seller-business" type="text" placeholder="Acme Electronics Pvt Ltd" required>
            </div>
            <div class="form-group">
                <label for="signup-seller-contact">Contact number <span class="optional">(optional)</span></label>
                <input id="signup-seller-contact" type="tel" placeholder="+91 9876543210">
            </div>
            <button class="btn-primary btn-full" onclick="signupSeller()">Create Seller Account</button>
        </div>

        <div id="signup-output" class="status-box"></div>
    </section>
</main>
</body>
</html>
