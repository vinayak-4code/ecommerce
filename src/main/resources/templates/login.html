<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - E-commerce Platform</title>
    <link rel="stylesheet" th:href="@{/css/ecommerce.css}">
    <script defer th:src="@{/js/ecommerce-ui.js}"></script>
</head>
<body>
<header>
    <div class="header-content">
        <span class="badge">Welcome Back</span>
        <h1>Log in to your account</h1>
        <p>Access your dashboard based on your role.</p>
        <nav class="header-nav">
            <a th:href="@{/}">← Home</a>
            <a th:href="@{/signup}">Don't have an account? Sign up</a>
        </nav>
    </div>
</header>
<main>
    <section class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchLoginTab('CUSTOMER')">🛒 Customer</button>
            <button class="tab-btn" onclick="switchLoginTab('SELLER')">🏬 Seller</button>
            <button class="tab-btn" onclick="switchLoginTab('PRODUCT_ADMIN')">🛡 Admin</button>
        </div>

        <div id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">Email address</label>
                <input id="login-email" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" placeholder="Your password" required>
            </div>
            <input type="hidden" id="login-role" value="CUSTOMER">
            <button class="btn-primary btn-full" onclick="loginFromPage()">Log In</button>
        </div>

        <div id="login-output" class="status-box"></div>

        <div class="seeded-credentials">
            <h3>🔑 Demo Credentials</h3>
            <p class="hint">Password for all: <strong>Password1</strong></p>
            <table class="credentials-table">
                <tr><td>Admin</td><td>admin@example.com</td></tr>
                <tr><td>Seller</td><td>seller@example.com</td></tr>
                <tr><td>Customer</td><td>customer@example.com</td></tr>
            </table>
        </div>
    </section>
</main>
</body>
</html>
