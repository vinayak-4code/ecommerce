spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_func;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        query:
          validation-enabled: false
  flyway:
    enabled: false
  security:
    user:
      name: test
      password: test
